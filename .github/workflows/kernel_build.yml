name: Build KernelSU + SUSFS

on:
  workflow_dispatch:
  push:
    branches:
      - 15.0-ksunsusfs

jobs:
  build:
    name: Build Kernel on Ubuntu
    runs-on: ubuntu-latest

    steps:
    - name: 📥 克隆源码
      uses: actions/checkout@v3

    - name: 🛠 安装依赖
      run: |
        sudo apt update
        sudo apt install -y \
          git curl bc build-essential flex bison \
          libssl-dev libelf-dev libncurses-dev \
          python3 python3-pip

    - name: ⚙️ 执行 setup.sh 脚本，配置 KernelSU Next 构建环境
      run: |
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs

    - name: 🧱 编译内核
      run: |
        ./build.sh

    - name: 📦 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Output
        path: |
          out/**/*.img
          out/**/*.gz
          out/**/*.dtb
          out/**/*.zip
          AnyKernel3/*.zip
          AnyKernel3/*.img
