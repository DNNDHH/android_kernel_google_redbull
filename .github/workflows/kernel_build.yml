name: Build KernelSU + SUSFS

on:
  workflow_dispatch:
  push:
    branches:
      - 15.0-ksunsusfs

jobs:
  build:
    name: Build Kernel on Ubuntu
    runs-on: ubuntu-latest

    steps:
    - name: 📥 克隆源码
      uses: actions/checkout@v3

    - name: 🛠 安装依赖
      run: |
        sudo apt update
        sudo apt install -y \
          git curl bc build-essential flex bison \
          libssl-dev libelf-dev libncurses-dev \
          python3 python3-pip

    - name: ⚙️ 克隆构建框架（KernelSU-Next）
      run: |
        git clone --depth=1 -b next https://github.com/rifsxd/KernelSU-Next ksu-next
        cp -r ksu-next/kernel/* ./

    - name: 🧱 执行 setup.sh 初始化构建环境
      run: |
        chmod +x setup.sh
        ./setup.sh next-susfs

    - name: 🧪 查看当前文件结构（可选）
      run: ls -la

    - name: 🚀 编译内核
      run: |
        chmod +x build.sh
        ./build.sh

    - name: 📦 上传构建产物
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Output
        path: |
          out/**/*.img
          out/**/*.gz
          out/**/*.dtb
          out/**/*.zip
          AnyKernel3/*.zip
